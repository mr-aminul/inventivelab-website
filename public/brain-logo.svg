<svg xmlns="http://www.w3.org/2000/svg" viewBox="256 281 506 493" fill="none" role="img" aria-labelledby="brainTitle">
  <style>
    svg { color: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      svg { color: #ffffff; }
    }
  </style>
  <title id="brainTitle">Inventive Lab geometric network brain</title>

  <!-- Inner triangulation: thin connecting lines between nodes -->
  <g stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- top peak + upper-left hub (big node A) -->
    <line x1="455" y1="293" x2="413" y2="446" />
    <line x1="455" y1="293" x2="562" y2="413" />
    <line x1="287" y1="383" x2="413" y2="446" />
    <line x1="268" y1="464" x2="413" y2="446" />
    <line x1="413" y1="446" x2="375" y2="505" />
    <line x1="413" y1="446" x2="562" y2="413" />
    <line x1="413" y1="446" x2="472" y2="511" />
    <line x1="413" y1="446" x2="432" y2="568" />

    <!-- left / lower-left mesh -->
    <line x1="268" y1="464" x2="375" y2="505" />
    <line x1="375" y1="505" x2="320" y2="590" />
    <line x1="375" y1="505" x2="472" y2="511" />
    <line x1="375" y1="505" x2="432" y2="568" />
    <line x1="432" y1="568" x2="472" y2="511" />
    <line x1="432" y1="568" x2="371" y2="638" />
    <line x1="432" y1="568" x2="485" y2="585" />
    <line x1="472" y1="511" x2="485" y2="585" />

    <!-- central mesh -->
    <line x1="472" y1="511" x2="568" y2="522" />
    <line x1="562" y1="413" x2="472" y2="511" />
    <line x1="562" y1="413" x2="568" y2="522" />
    <line x1="562" y1="413" x2="660" y2="461" />
    <line x1="562" y1="413" x2="735" y2="405" />
    <line x1="562" y1="413" x2="638" y2="352" />

    <!-- right mesh -->
    <line x1="568" y1="522" x2="660" y2="461" />
    <line x1="568" y1="522" x2="642" y2="526" />
    <line x1="568" y1="522" x2="485" y2="585" />
    <line x1="568" y1="522" x2="658" y2="580" />
    <line x1="660" y1="461" x2="638" y2="352" />
    <line x1="660" y1="461" x2="735" y2="405" />
    <line x1="660" y1="461" x2="750" y2="494" />
    <line x1="660" y1="461" x2="642" y2="526" />
    <line x1="642" y1="526" x2="750" y2="494" />
    <line x1="642" y1="526" x2="658" y2="580" />
  </g>

  <!-- Outer silhouette: thick low-poly outline with brainstem point -->
  <path
    d="M455,293 L638,352 L735,405 L750,494 L712,549 L658,580 L485,585 L481,762 L371,638 L320,590 L268,464 L287,383 Z"
    stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Nodes -->
  <g fill="currentColor">
    <circle cx="413" cy="446" r="18" />
    <circle cx="268" cy="464" r="13" />
    <circle cx="562" cy="413" r="13" />
    <circle cx="735" cy="405" r="13" />
    <circle cx="660" cy="461" r="13" />
    <circle cx="750" cy="494" r="13" />
    <circle cx="472" cy="511" r="13" />
    <circle cx="568" cy="522" r="13" />
    <circle cx="642" cy="526" r="13" />
    <circle cx="375" cy="505" r="13" />
    <circle cx="485" cy="585" r="13" />
    <circle cx="658" cy="580" r="13" />
    <circle cx="320" cy="590" r="13" />
    <circle cx="432" cy="568" r="13" />
    <circle cx="371" cy="638" r="13" />
  </g>
</svg>
